[project]
name = "boardly-backend"
version = "0.1.0"
description = "FastAPI backend for Boardly, a mini kanban board"
readme = "README.md"
authors = [
    { name = "AlfredoSaira", email = "alfredosaira@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.0.53",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff.lint]
# B008: FastAPI's `= Depends(...)` in a parameter default is the documented
# pattern, not the mutable-default footgun this rule is meant to catch.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
