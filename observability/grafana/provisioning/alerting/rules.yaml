apiVersion: 1

groups:
  - orgId: 1
    name: boardly-alerts
    folder: Boardly Alerts
    interval: 1m
    rules:
      # User impact, not resource usage: a 5xx means someone tried to create,
      # move, edit or delete a card (or load the board) and it did not happen.
      - uid: boardly-card-actions-failing
        title: "Board actions failing (5xx)"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              instant: true
              expr: >-
                sum(increase(boardly_http_requests_total{http_status_code=~"5.."}[5m]))
                or vector(0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        labels:
          service: boardly-backend
          severity: critical
        annotations:
          summary: >-
            Boardly: board API requests are failing with 5xx in the last 5
            minutes, so users cannot save their changes. Dashboard:
            http://localhost:3000/d/boardly/boardly
